<script>

/* ========================================= */
/* GLOBAL SPINE LOGIC */
/* ========================================= */

const auroraNavbar =
document.getElementById('auroraNavbar');

window.addEventListener('scroll', () => {

if(window.scrollY > 40){

auroraNavbar.classList.add('scrolled');

}else{

auroraNavbar.classList.remove('scrolled');

}

});

/* ========================================= */
/* HAMBURGER */
/* ========================================= */

const auroraHamburger =
document.getElementById('auroraHamburger');

const auroraMobileMenu =
document.getElementById('auroraMobileMenu');

auroraHamburger.addEventListener('click', () => {

auroraMobileMenu.classList.toggle('active');

});

/* ========================================= */
/* CLOSE MENU ON LINK CLICK */
/* ========================================= */

const auroraLinks =
document.querySelectorAll(
'.aurora-mobile-menu a'
);

auroraLinks.forEach(link => {

link.addEventListener('click', () => {

auroraMobileMenu.classList.remove('active');

});

});

</script>
